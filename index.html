<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo AI 4.1 - Iyanda Farms</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:#0a0a0a}
header{padding:12px;text-align:center;background:#111;position:sticky;top:0;z-index:10}
#keyBox{background:#1a1a1a;padding:10px;text-align:center}
#keyBox input{width:70%;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
button{padding:10px 14px;border:none;border-radius:8px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer}
#modes{display:flex;overflow-x:auto;gap:6px;padding:10px;background:#111}
.modeBtn{white-space:nowrap;padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333}
.modeBtn.active{background:#FFD700;color:#000}
#chat{padding:14px;min-height:60vh;padding-bottom:90px;line-height:1.6}
.msg{margin:12px 0;padding:12px;border-radius:12px;background:rgba(0,0,0,.55);white-space:pre-wrap}
.user{background:#FFD700;color:#000;font-weight:bold}
#inputBar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:10px;background:#111}
#inputBar input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
.hidden{display:none}
</style></head><body>
<header><b id="appTitle">SOLO AI 4.1</b><div id="modeLabel" style="font-size:12px;opacity:.8">Super Chat</div>
<div id="status" style="font-size:12px;color:#7CFC00">● Connected - Key Saved</div></header>

<div id="keyBox"><input id="apiKey" placeholder="Paste AQ. key once"><button onclick="saveKey()">Save & Lock Key</button></div>

<div id="modes"></div>
<div id="chat"></div>
<div id="inputBar"><input id="userInput" placeholder="Ask Solo AI..."><button onclick="ask()">Send</button></div>

<script>
const MODES=[
{id:'super',name:'1. Super Chat',bg:'#0a0a0a',accent:'#FFD700',prompt:'You are Solo AI. Be helpful, concise. NEVER introduce yourself or mention creator unless user asks who created you.'},
{id:'business',name:'2. Business',bg:'#1a1200',accent:'#FFD700',prompt:'You are a Nigerian business expert. Give clear plans, Naira amounts, tables. NEVER introduce yourself.'},
{id:'farm',name:'3. Farm Mode',bg:'#06210f',accent:'#2ecc71',prompt:'You are a Nigerian farm expert for Iyanda Farms. Practical steps, local prices. NEVER introduce yourself.'},
{id:'money',name:'4. Money & Market',bg:'#0d1a2e',accent:'#00d4ff',prompt:'You are a money/market expert. Prices, profit calc. NEVER introduce yourself.'},
{id:'learn',name:'5. Learn Mode',bg:'#220a2e',accent:'#c084fc',prompt:'You are a teacher. Explain simply step by step. NEVER introduce yourself.'},
{id:'music',name:'6. Music Studio',bg:'#2b0a1a',accent:'#ff4d8d',prompt:'You are a music producer. Give Title, Key, Tempo, Verse, Chorus, Bridge, Chords. Do NOT repeat intro.'},
{id:'creator',name:'7. Creator Studio',bg:'#1a0f00',accent:'#ff8c00',prompt:'You are a content creator coach. Give scripts, captions, hooks. NEVER introduce yourself.'},
];
let current='super';
let histories={}; MODES.forEach(m=>histories[m.id]=[]);
let apiKey=localStorage.getItem('solo_api_key')||'';
let introduced=false;

function renderModes(){
  document.getElementById('modes').innerHTML=MODES.map(m=>`<button class="modeBtn ${m.id===current?'active':''}" onclick="switchMode('${m.id}')">${m.name}</button>`).join('');
}
function switchMode(id){
  current=id; let m=MODES.find(x=>x.id===id);
  document.body.style.background=m.bg;
  document.getElementById('appTitle').innerText='SOLO AI 4.1 - '+m.name;
  document.getElementById('modeLabel').innerText=m.name+' • '+m.accent;
  renderModes(); renderChat();
}
function renderChat(){
  let h=histories[current];
  document.getElementById('chat').innerHTML=h.map(x=>`<div class="msg ${x.role==='user'?'user':''}">${x.text}</div>`).join('')||`<div class="msg">Welcome to <b>${MODES.find(m=>m.id===current).name}</b> — This is a separate page. Ask anything in this mode.</div>`;
  window.scrollTo(0,document.body.scrollHeight);
}
function saveKey(){
  let v=document.getElementById('apiKey').value.trim();
  if(!v.startsWith('AQ.')){alert('Paste valid AQ. key');return}
  apiKey=v; localStorage.setItem('solo_api_key',v);
  document.getElementById('keyBox').classList.add('hidden');
  document.getElementById('status').innerText='● Connected - Key Saved Forever';
  if(!introduced){introduced=true; histories[current].push({role:'ai',text:'Welcome Founder. I am Solo AI 4.1, created by Iyanda Solomon Ayobami. Your key is locked. I will not repeat this intro again. What shall we build today?'}); renderChat();}
}
async function ask(){
  let inp=document.getElementById('userInput'); let q=inp.value.trim(); if(!q) return;
  if(!apiKey){alert('Paste key first');return}
  histories[current].push({role:'user',text:q}); inp.value=''; renderChat();
  histories[current].push({role:'ai',text:'Thinking...'}); renderChat();
  let mode=MODES.find(m=>m.id===current);
  let models=['gemini-3.5-flash-lite','gemini-2.5-flash-lite','gemini-2.0-flash','gemini-2.5-flash'];
  let done=false;
  for(let model of models){
    try{
      let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:mode.prompt+'\nUser: '+q}]}],generationConfig:{temperature:0.7}})});
      let d=await r.json();
      let ans=d.candidates?.[0]?.content?.parts?.[0]?.text;
      if(ans){histories[current][histories[current].length-1]={role:'ai',text:ans}; done=true; break;}
    }catch(e){}
  }
  if(!done) histories[current][histories[current].length-1]={role:'ai',text:'Network busy, please try again.'};
  renderChat();
}
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
if(apiKey){
  document.getElementById('keyBox').classList.add('hidden');
  document.getElementById('status').innerText='● Connected - Key Saved Forever';
  histories[current].push({role:'ai',text:'Welcome back Founder. Key is saved. No need to paste again.'});
}
renderModes(); switchMode('super');
</script></body></html>
